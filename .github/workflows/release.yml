name: Release Enterprise Solutions

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Validate and release enterprise solutions
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up CUE
        uses: cue-lang/setup-cue@v1.0.0

      - name: Validate solution definitions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          documents=(*/pomology.json)

          if (( ${#documents[@]} == 0 )); then
            echo "::error::No solution Pomology documents found."
            exit 1
          fi

          for document in "${documents[@]}"; do
            echo "Validating ${document}"
            cue vet -c pomology.cue "${document}"
          done

      - name: Package enterprise solutions
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          documents=(*/pomology.json)

          mkdir -p dist/release
          cp pomology.cue dist/release/

          for document in "${documents[@]}"; do
            solution="${document%%/*}"
            mkdir -p "dist/release/${solution}"
            cp "${document}" "dist/release/${solution}/"
          done

          (
            cd dist/release
            zip -r "../enterprise_solutions-${GITHUB_REF_NAME}.zip" .
          )

      - name: Generate build provenance attestation
        uses: actions/attest@v4.2.2
        with:
          subject-path: dist/enterprise_solutions-${{ github.ref_name }}.zip

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" \
            "dist/enterprise_solutions-${GITHUB_REF_NAME}.zip" \
            --verify-tag \
            --title "Enterprise Solutions ${GITHUB_REF_NAME}" \
            --generate-notes